name: 问题反馈
description: 报告知处的异常行为
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题与复现步骤
      description: 请描述操作步骤、实际结果以及期望结果，避免包含私人文件或邮件内容。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 知处与 macOS 版本
      placeholder: 知处 0.1.11，macOS 26
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Mac 型号
      placeholder: MacBook Air M2，16 GB
  - type: textarea
    id: evidence
    attributes:
      label: 截图或已脱敏的日志
      description: 分享前请移除私人信息、邮箱地址、文件名与搜索词。
